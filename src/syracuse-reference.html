<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syracuse College-Town Reference</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f0f2f5; --ink:#16191d; --ink-2:#4a5159;
  --ink-3:#7b838c; --line:#e2e6eb; --line-2:#cdd3da; --accent:#3b5bdb; --accent-ink:#2942a8;
  --map-bg:#eef1f4; --map-stroke:rgba(90,100,110,.30); --sel:#111418;
  --v:#2f9e54; --r:#c9871f; --e:#7a8290; --gap:#c0392b;
  --shadow:0 1px 2px rgba(16,20,26,.06),0 4px 16px rgba(16,20,26,.06);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Charter",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317; --panel:#171b21; --panel-2:#1e242c; --ink:#e9edf1; --ink-2:#b3bcc6;
  --ink-3:#7e8892; --line:#242b34; --line-2:#333c47; --accent:#7d97ff; --accent-ink:#a9bcff;
  --map-bg:#141a21; --map-stroke:rgba(150,163,176,.22); --sel:#f4f7fa;
  --v:#4cc47b; --r:#e0a63f; --e:#8892a0; --gap:#e5695b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 22px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#101317; --panel:#171b21; --panel-2:#1e242c; --ink:#e9edf1; --ink-2:#b3bcc6;
  --ink-3:#7e8892; --line:#242b34; --line-2:#333c47; --accent:#7d97ff; --accent-ink:#a9bcff;
  --map-bg:#141a21; --map-stroke:rgba(150,163,176,.22); --sel:#f4f7fa;
  --v:#4cc47b; --r:#e0a63f; --e:#8892a0; --gap:#e5695b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3{line-height:1.15;margin:0;text-wrap:balance}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- nav ---------- */
header.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 14px;height:54px}
.brand{font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none}
.brand b{font-weight:700}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
nav#tabs{display:flex;gap:2px;overflow-x:auto;flex:1;height:100%;align-items:center;scrollbar-width:none;-ms-overflow-style:none}
nav#tabs::-webkit-scrollbar{display:none}
.navsep{width:1px;height:18px;background:var(--line-2);flex:none;margin:0 5px;opacity:.7}
nav button.tab{font:inherit;font-size:12.5px;color:var(--ink-2);background:none;border:1px solid transparent;
  padding:6px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;flex:none}
nav button.tab:hover{background:var(--panel-2);color:var(--ink)}
nav button.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.nav-sp{display:none}
.icon-btn{font:inherit;font-size:14px;color:var(--ink-2);background:none;border:1px solid var(--line-2);
  padding:6px 10px;border-radius:8px;cursor:pointer;flex:none}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}
/* anchored blocks clear the sticky nav */
[id^="q-"],[id^="f-"]{scroll-margin-top:66px}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:22px 18px 80px}
.wrap-narrow{max-width:820px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.02em;padding:2px 6px;border-radius:5px;border:1px solid transparent;vertical-align:middle}
.chip.v{color:#fff;background:var(--v)} .chip.r{color:#1a1205;background:var(--r)}
.chip.e{color:#fff;background:var(--e)} .chip.gap{color:var(--gap);border-color:var(--gap);background:transparent}

/* ---------- map ---------- */
.maplayout{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:900px){.maplayout{grid-template-columns:1fr}}
.mapstage{position:relative;background:var(--map-bg);border:1px solid var(--line);border-radius:12px;
  overflow:hidden;box-shadow:var(--shadow);height:clamp(420px,66vh,700px)}
.mapstage svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mapstage svg.drag{cursor:grabbing}
@media(max-width:900px){.mapstage{height:clamp(360px,52vh,520px)}}
.mapctrls{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;z-index:5;max-width:250px}
.layerrow{display:flex;gap:4px;flex-wrap:wrap;background:color-mix(in srgb,var(--panel) 92%,transparent);
  border:1px solid var(--line);border-radius:9px;padding:5px}
.layerrow button{font:inherit;font-size:11.5px;padding:4px 8px;border-radius:6px;border:1px solid transparent;
  background:none;color:var(--ink-2);cursor:pointer}
.layerrow button:hover{background:var(--panel-2);color:var(--ink)}
.layerrow button.on{background:var(--accent);color:#fff}
.zoomctrl{position:absolute;bottom:10px;right:10px;display:flex;flex-direction:column;gap:4px;z-index:5}
.zoomctrl button{width:30px;height:30px;font-size:17px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--panel);color:var(--ink);cursor:pointer;line-height:1}
.legend{background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font-size:11.5px;position:absolute;bottom:10px;left:10px;z-index:5;max-width:250px}
.legend .lg-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid var(--map-stroke)}
.legend .lg-title{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.lg-note{font-size:11px;line-height:1.35;color:var(--ink-2);margin:2px 0 6px;max-width:230px}
.parcel{stroke:var(--map-stroke);stroke-width:.4;transition:opacity .1s}
.parcel:hover{stroke:var(--sel);stroke-width:1.1}
.parcel.sel{stroke:var(--sel);stroke-width:1.6}
.arealabel{fill:var(--ink);font-family:var(--sans);font-weight:800;paint-order:stroke;
  stroke:var(--map-bg);stroke-width:3.5px;pointer-events:none;letter-spacing:.01em}
.streetlabel{fill:var(--ink-2);font-family:var(--sans);font-size:8px;font-weight:600;pointer-events:none;paint-order:stroke;stroke:var(--map-bg);stroke-width:2.4px;display:none}
svg.zoomed .streetlabel{display:block}
.parcel.ctx{opacity:.38}
.parcel.ctx:hover{opacity:.85}
.nb{fill:none;stroke:var(--sel);stroke-linejoin:round;pointer-events:none}
.nb.core{stroke-opacity:.9}
.nb.ctx{stroke-opacity:.5}
.arealabel.ctx{font-weight:700;opacity:.8}
svg.noborders .nb,svg.noborders .arealabel.ctx{display:none}
.glarea.ctx{font-size:10.5px;font-weight:700;opacity:.9}
.glarea.hide{display:none}
.btn-clear{float:right;margin:0 0 6px 10px;font:inherit;font-size:12px;line-height:1.2;padding:4px 9px;border:1px solid rgba(120,130,140,.45);border-radius:7px;background:transparent;color:inherit;opacity:.75;cursor:pointer}
.btn-clear:hover{opacity:1;border-color:var(--sel);color:var(--sel)}
.corebound{fill:none;stroke:var(--sel);stroke-width:1.4;stroke-dasharray:6 5;opacity:.45;pointer-events:none}
.mapanno{position:absolute;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink-2);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:3px 8px;z-index:4;pointer-events:none;white-space:nowrap}
.maphint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-3);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:20px;padding:3px 12px;z-index:4;pointer-events:none}
.mapsearch{position:relative;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:9px;padding:4px}
.mapsearch input{width:100%;font:inherit;font-size:12px;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--panel);color:var(--ink)}
.mapsearch-res{display:none;position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);max-height:250px;overflow-y:auto;z-index:8}
.mapsearch-res.on{display:block}
.msrow{padding:6px 9px;cursor:pointer;border-bottom:1px solid var(--line)}
.msrow:last-child{border-bottom:none}
.msrow:hover{background:var(--panel-2)}
.msaddr{font-size:12px;font-weight:600;color:var(--ink)}
.msown{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.viewmodes{display:flex;gap:3px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:9px;padding:4px}
.viewmodes button{font:inherit;font-size:11.5px;padding:5px 9px;border-radius:6px;border:1px solid transparent;background:none;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.viewmodes button:hover{background:var(--panel-2);color:var(--ink)}
.viewmodes button.on{background:var(--accent);color:#fff;font-weight:600}
.glarea{font-family:var(--sans);font-weight:800;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 3px rgba(0,0,0,.9);pointer-events:none;white-space:nowrap;letter-spacing:.01em}
.mapstage .maplibregl-map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:9.5px;opacity:.85}
.maplibregl-popup{display:none}
.maplibregl-ctrl-group button{width:30px;height:30px}
.info .kv{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;font-size:12.5px;margin-top:4px}
.info .kv dd{text-align:left;margin:0;word-break:break-word}
.info .kvgroup{margin-top:13px}
.info .kvglabel{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

/* info panel */
.info h3{font-size:16px;margin-bottom:2px}
.info .kv dt{color:var(--ink-3)}
.statline{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.statline b{font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--ink-3)}

/* stub / overview */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.stub{border:1px dashed var(--line-2);border-radius:12px;padding:26px;color:var(--ink-3);text-align:center}
.glance{display:flex;gap:22px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0}
.glance .g{display:flex;flex-direction:column}
.glance .g b{font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.glance .g span{font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* clickable vs static: interactive things lift + glow; info panels stay flat */
.clickable{cursor:pointer;transition:transform .08s ease,border-color .12s,box-shadow .12s}
.clickable:hover{transform:translateY(-1px);border-color:var(--accent)}
.card-arrow{color:var(--accent);font-weight:700}

/* section lens */
.covbar{display:flex;gap:8px;align-items:center;font-size:12px;font-family:var(--mono);flex-wrap:wrap;margin-top:4px}
.covpill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;border:1px solid var(--line-2)}
.covpill .d{width:8px;height:8px;border-radius:50%}
.cov-complete{background:var(--v)} .cov-partial{background:var(--r)} .cov-gap{background:var(--gap)}
.subq{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);margin:14px 0;overflow:hidden}
.subq.related{background:var(--panel-2);border-style:dashed}
.qhead{padding:14px 18px;cursor:pointer;user-select:none}
.qhead:hover{background:var(--panel-2)}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qid{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.qbadge{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.qbadge.complete{color:var(--v);border:1px solid var(--v)}
.qbadge.partial{color:var(--r);border:1px solid var(--r)}
.qbadge.gap{color:var(--gap);border:1px solid var(--gap)}
.chev{margin-left:auto;color:var(--ink-3);font-size:11px;transition:transform .15s}
.subq.closed .chev{transform:rotate(-90deg)}
.qtext{font-weight:650;font-size:16.5px;line-height:1.3;letter-spacing:-.01em}
.qbody{padding:2px 18px 18px}
.subq.closed .qbody{display:none}
.flabel{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px}
.answer{font-family:var(--serif);font-size:16px;line-height:1.56;color:var(--ink);padding-left:14px;border-left:3px solid var(--accent)}
.gapnote{font-size:13px;color:var(--gap);background:color-mix(in srgb,var(--gap) 8%,transparent);border:1px solid color-mix(in srgb,var(--gap) 30%,transparent);border-radius:8px;padding:9px 12px;margin-top:12px}
.factlist{margin-top:2px}
.fact{padding:12px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:none}
.fact .frow{display:flex;gap:18px;align-items:baseline;justify-content:space-between}
.fact .claim{font-size:14px;line-height:1.5;flex:1}
.fact .claim ul{margin:3px 0 0;padding-left:18px}
.fact .claim li{margin:3px 0}
.fact .val{font-family:var(--mono);font-weight:700;font-size:14.5px;white-space:nowrap;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.fact .src{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--ink-3)}
.fact .snote{font-style:italic}
.copybtn{font:inherit;font-size:11px;color:var(--ink-3);background:none;border:1px solid var(--line-2);border-radius:5px;padding:2px 8px;cursor:pointer}
.copybtn:hover{color:var(--ink);background:var(--panel-2)}
h3.h{font-size:16px;margin:32px 0 4px;font-weight:650}
.sublabel{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 10px}

/* tables */
.reg{width:100%;border-collapse:collapse;font-size:13px}
.reg th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px;border-bottom:1px solid var(--line-2);background:var(--panel)}
.reg td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.reg tr:hover td{background:var(--panel-2)}
.reg .strike{text-decoration:line-through;color:var(--ink-3)}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
.verdict{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:1px 6px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-2)}

/* search */
.searchbar{display:flex;gap:10px;align-items:center;margin:4px 0 12px}
.searchbar input{flex:1;font:inherit;font-size:15px;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);color:var(--ink)}
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 16px}
.fchip{font:inherit;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer}
.fchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sresult{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:8px;cursor:pointer}
.sresult:hover{border-color:var(--line-2);background:var(--panel-2)}
.sresult .st{font-size:13.5px;line-height:1.4}
.sresult .meta{margin-top:5px;font-size:11.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;overflow-wrap:anywhere}
.sresult .meta .muted{min-width:0;overflow-wrap:anywhere}

/* timeline */
.tl{position:relative;margin-top:16px}
.tlrow{display:grid;grid-template-columns:58px 1fr;gap:0;align-items:start}
.tlyear{font-family:var(--mono);font-weight:700;font-size:15px;color:var(--accent);text-align:right;padding:0 14px 0 0;font-variant-numeric:tabular-nums;position:sticky;top:60px}
.tlevents{border-left:2px solid var(--line-2);padding:0 0 20px 22px;position:relative}
.tlevents::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tlcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:9px;box-shadow:var(--shadow)}
.tlcard .tt{font-weight:600;font-size:14px;line-height:1.35;display:flex;gap:9px;align-items:baseline}
.tlcard .sx{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);flex:none;cursor:pointer}
.tlcard .ttl{flex:1}
.tlcard .wu{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:6px}

/* sub-tabs (registers, etc.) */
.subtabs{display:flex;gap:6px;margin:6px 0 16px;flex-wrap:wrap}
.subtab{font:inherit;font-size:13px;padding:7px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer}
.subtab:hover{background:var(--panel-2);color:var(--ink)}
.subtab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

/* timeline v2 — each card is self-dated, grouped by year */
.tl2{margin-top:18px;position:relative;padding-left:22px}
.tl2::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line-2)}
.tlgroup{margin-bottom:16px}
.tlgroup>.yr{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums;margin:0 0 9px;position:relative}
.tlgroup>.yr::before{content:"";position:absolute;left:-22px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tlcard2{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px 11px;box-shadow:var(--shadow);margin-bottom:9px}
.tlcard2 .dchip{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.tlcard2 .tt2{font-weight:650;font-size:14.5px;line-height:1.32;margin:2px 0 0;display:flex;gap:8px;align-items:baseline}
.tlcard2 .sx2{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--accent);cursor:pointer;flex:none;border:1px solid var(--line-2);border-radius:4px;padding:0 5px}
.tlcard2 .ttl2{flex:1}
.tlcard2 .wu2{font-size:13px;color:var(--ink-2);line-height:1.52;margin-top:6px}

/* charts */
.chartgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
figure.chart{position:relative;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 10px;box-shadow:var(--shadow);min-width:0}
figure.chart.wide{grid-column:span 2}
@media(max-width:719px){figure.chart.wide{grid-column:span 1}}
/* instant chart tooltip (replaces the delayed native <title>) */

.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}

.imp .claim-lead{font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink);margin:9px 18px 0;padding-left:14px;border-left:3px solid var(--accent)}
.imp .imp-sec{padding:2px 18px}
.imp .imp-sec .flabel{margin:16px 0 6px}
.imp .basis{font-size:13.5px;line-height:1.55;color:var(--ink-2)}
.imp .caveat{font-size:13px;line-height:1.5;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:6px 18px 0}
.imp .caveat b{color:var(--ink)}

/* analytical tables (roster / landlords) */
.dtable{width:100%;border-collapse:collapse;font-size:13px}

<aside style="padding:14px 24px;background:#edf4ef;color:#173f32;font:16px/1.5 system-ui;text-align:center;position:relative;z-index:1000">New: <a style="color:#173f32;font-weight:700;text-decoration:underline" href="briefing/">Read the illustrated Syracuse plans briefing — September 7, 2026</a>. The earlier reference site remains below.</aside>

<script>
"use strict";
const PARCELS = window.PARCELS || {features:[]};
const DATA = window.DATA || null;
const $ = (s,r=document)=>r.querySelector(s);

/* ---------- helpers ---------- */
function el(tag,attrs,...kids){
  const e=document.createElementNS(tag==="svg"||attrs&&attrs._svg?"http://www.w3.org/2000/svg":"http://www.w3.org/1999/xhtml",tag);
  if(attrs)for(const k in attrs){
    if(k==="_svg")continue;
    if(k==="class")e.setAttribute("class",attrs[k]);
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k.startsWith("on")&&typeof attrs[k]==="function")e.addEventListener(k.slice(2),attrs[k]);
    else if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
  }
  for(const c of kids){if(c==null||c===false)continue;e.appendChild(c instanceof Node?c:document.createTextNode(String(c)));}
  return e;
}
const svgEl=(tag,attrs)=>{const e=document.createElementNS("http://www.w3.org/2000/svg",tag);
  if(attrs)for(const k in attrs)if(attrs[k]!=null)e.setAttribute(k,attrs[k]);return e;};
const fmtMoney=v=>{if(v==null)return"—";if(v>=1e6)return"$"+(v/1e6).toFixed(2)+"M";if(v>=1e3)return"$"+(v/1e3).toFixed(0)+"k";return"$"+v;};
const fmtInt=v=>v==null?"—":v.toLocaleString("en-US");

/* ---------- theme ---------- */
(function(){let t=null;try{t=localStorage.getItem("syr-theme");}catch(e){}
  if(t)document.documentElement.setAttribute("data-theme",t);
  $("#themebtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const mq=window.matchMedia("(prefers-color-scheme:dark)").matches;
    const next=cur?(cur==="dark"?"light":"dark"):(mq?"light":"dark");
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("syr-theme",next);}catch(e){}
    if(state.view==="map"){if(mapGL)refreshGLTheme();else if(typeof recolorMap==="function")recolorMap();}
  });})();

/* ---------- nav ---------- */
// One canonical order, used by both the nav and the overview. Grouped so the
// bar reads as clusters, not one long trailing list. Section tabs show just the
// § number (full titles are on the overview cards and the page headers).
const NAVGROUPS=[
  [["overview","Overview","Overview"]],
  [["s2","§2","Planning & Zoning"],["s3","§3","District Context"],["s4","§4","Governance"],
   ["s7","§7","Real Estate"],["s10","§10","Current Issues"]],
  [["implications","Collegetown","Implications for Collegetown"],["framework","SU Framework","Syracuse University's plan (2017 → 2023)"],
   ["roster","Development","Development roster"],["landlord","Landlords","Ownership & landlords"]],
  [["map","Map","Parcel map"],["timeline","Timeline","Timeline"],["charts","Charts","Charts & trends"],["search","Search","Search"]],
  [["registers","Registers","Sources, corrections & open items"]],
];
const TABS=NAVGROUPS.flat();
function buildTabs(){const n=$("#tabs");
  NAVGROUPS.forEach((grp,gi)=>{
    if(gi)n.appendChild(el("span",{class:"navsep"}));
    grp.forEach(([id,label,full])=>n.appendChild(el("button",{class:"tab","data-go":id,title:full||label,onclick:()=>go(id)},label)));
  });}
const REG_ALIAS={sources:"registers",corrections:"registers",open:"registers"};
function markTab(){const v=REG_ALIAS[state.view]||state.view;
  document.querySelectorAll("nav .tab").forEach(b=>b.classList.toggle("on",b.dataset.go===v));}

/* ---------- router ---------- */
const state={view:"map",mapLayer:"ownerClass",sel:null,borders:(()=>{try{return localStorage.getItem("syr-borders")!=="off";}catch(e){return true;}})()};
let mapBorders=[];
function go(v){state.view=v;location.hash=v;render();}
window.addEventListener("hashchange",()=>{const h=location.hash.replace(/^#/,"").split("=")[0];
  if(h&&h!==state.view){state.view=h;render();}});
const SECMAP={s2:2,s3:3,s4:4,s7:7,s10:10};
function render(){markTab();const v=$("#view");
  if(mapGL){try{mapGL.remove();}catch(e){}mapGL=null;}      // dispose WebGL context on nav
  if(_glFallbackTimer){clearTimeout(_glFallbackTimer);_glFallbackTimer=null;}
  state.sel=null;                                            // selection never crosses views
  v.innerHTML="";if(state.view!=="search")window.scrollTo(0,0);
  if(state.view==="map")return renderMap(v);
  if(state.view==="overview")return renderOverview(v);
  if(!DATA)return renderStub(v);
  if(state.view in SECMAP)return renderSection(v,SECMAP[state.view]);
  if(state.view==="implications")return renderImplications(v);
  if(state.view==="framework")return renderFramework(v);
  if(state.view==="roster")return renderRoster(v);
  if(state.view==="landlord")return renderLandlord(v);
  if(state.view==="search")return renderSearch(v);
  if(state.view==="timeline")return renderTimeline(v);
  if(state.view==="charts")return renderCharts(v);
  if(state.view==="registers"||state.view==="sources"||state.view==="corrections"||state.view==="open")return renderRegisters(v);
  return renderStub(v);}

/* ---------- map projection ---------- */
let MAPW=900,MAPH=680;const PAD=24;
let PROJ=null;
function setupProjection(){
  let minLon=1e9,maxLon=-1e9,minLat=1e9,maxLat=-1e9;
  for(const f of PARCELS.features){const rings=f.geometry.type==="Polygon"?f.geometry.coordinates:f.geometry.coordinates.flat();
    for(const ring of rings)for(const p of ring){if(p[0]<minLon)minLon=p[0];if(p[0]>maxLon)maxLon=p[0];
      if(p[1]<minLat)minLat=p[1];if(p[1]>maxLat)maxLat=p[1];}}
  const meanLat=(minLat+maxLat)/2, k=Math.cos(meanLat*Math.PI/180);
  const geoW=(maxLon-minLon)*k, geoH=(maxLat-minLat);
  const s=(MAPW-2*PAD)/geoW;               // fit to width
  MAPH=Math.round(geoH*s+2*PAD);           // tight height, no dead space
  PROJ={minLon,maxLat,k,s,offX:PAD,offY:PAD};
}
const projX=lon=>PROJ.offX+(lon-PROJ.minLon)*PROJ.k*PROJ.s;
const projY=lat=>PROJ.offY+(PROJ.maxLat-lat)*PROJ.s;
function ringPath(ring){let d="";for(let i=0;i<ring.length;i++){const x=projX(ring[i][0]).toFixed(1),y=projY(ring[i][1]).toFixed(1);d+=(i?"L":"M")+x+" "+y;}return d+"Z";}
function parcelPath(f){const g=f.geometry;const polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;
  return polys.map(poly=>poly.map(ringPath).join("")).join("");}

/* ---------- map color schemes ---------- */
const ZONE_COLORS={R1:"#c7e9b4",R2:"#a1d99b",R3:"#74c476",R4:"#41ab5d",R5:"#238b45",
  "MX-1":"#fdd0a2","MX-2":"#fdae6b","MX-3":"#fd8d3c","MX-4":"#e6550d","MX-5":"#a63603",
  PID:"#6a51a3",OS:"#9ecae1",IN:"#c6c6f0",CM:"#dd3497",PDD:"#807dba",Pending:"#d9d9d9"};
const OWNER_COLORS={su:"#e6550d",hospital:"#3182bd",government:"#756bb1",nonprofit:"#31a354",private:"#c7ccd1"};
const OWNER_LABELS={su:"Syracuse University",hospital:"Hospital / medical",government:"Government / public",nonprofit:"Church / nonprofit",private:"Private owner"};
const SCOPE_COLORS={national:"#d73027",nyother:"#fc8d59",local:"#91bfdb",na:"#e5e7eb",unknown:"#c7ccd1"};
const SCOPE_LABELS={national:"Tax bill mailed out of state",nyother:"Tax bill mailed elsewhere in New York",local:"Tax bill mailed to Central New York",na:"Not private (SU, hospital, government, nonprofit)",unknown:"Mailing address not parsed"};
const LU_COLORS={residential:"#fee391",multifamily:"#e6b422",university:"#e6550d",commercial:"#b2182b",
  institutional:"#3182bd",openspace:"#31a354",parking:"#969696",vacant:"#8c510a",other:"#d9d9d9"};
const LU_LABELS={residential:"1–2 family residential",multifamily:"Apartments / multi-family",university:"College / university",
  commercial:"Commercial",institutional:"Institutional (school/church/hospital)",openspace:"Parks, playgrounds, cemeteries",parking:"Parking",vacant:"Vacant",other:"Other"};
function luGroup(lu){lu=(lu||"").toLowerCase();
  if(/vacant/.test(lu))return"vacant";
  if(/college|univ/.test(lu))return"university";
  if(/apart|apt|3 fam|three fam|multiple res|converted|row/.test(lu))return"multifamily";
  if(/1 fam|one fam|2 fam|two fam|single|res\b|residence|home/.test(lu))return"residential";
  if(/comm|retail|store|office|restaurant|bank|hotel|bar\b/.test(lu))return"commercial";
  if(/municpl park|playground|cemetery/.test(lu))return"openspace";
  if(/park/.test(lu))return"parking";
  if(/school|church|hosp|govern|public|relig|educ|library|museum/.test(lu))return"institutional";
  return"other";}
const YEAR_LEGEND=[["#99000d","before 1900"],["#cb181d","1900–1940"],["#fb6a4a","1940–1970"],["#fcae91","1970–2000"],["#fee5d9","2000 or later"]];
function yearColor(y){if(!y)return"#e5e7eb";if(y<1900)return"#99000d";if(y<1940)return"#cb181d";if(y<1970)return"#fb6a4a";if(y<2000)return"#fcae91";return"#fee5d9";}
function valColor(av){if(!av)return"#e5e7eb";const l=Math.log10(av);
  const stops=[[3,"#ffffcc"],[4.3,"#fed976"],[5,"#fd8d3c"],[5.7,"#e31a1c"],[6.5,"#800026"]];
  for(let i=stops.length-1;i>=0;i--)if(l>=stops[i][0])return stops[i][1];return stops[0][1];}
function colorFor(p,layer){
  if(layer==="zone")return ZONE_COLORS[p.zone]||"#d9d9d9";
  if(layer==="ownerClass")return OWNER_COLORS[p.ownerClass]||"#c7ccd1";
  if(layer==="ownerScope")return SCOPE_COLORS[p.ownerScope]||"#e5e7eb";
  if(layer==="av")return valColor(p.av);
  if(layer==="year")return yearColor(p.year);
  if(layer==="landuse")return LU_COLORS[luGroup(p.landUse)];
  if(layer==="vacant")return p.vacant?"#d73027":"#dfe3e8";
  return"#ccc";
}

/* ---------- map render ---------- */
let mapG=null,zoom={k:1,x:0,y:0};
const MAP_LAYERS=[["ownerClass","Ownership"],["ownerScope","Tax mailing address"],["zone","Zoning"],
  ["av","Assessed value"],["year","Building age"],["landuse","Land use"],["vacant","Vacancy"]];
function colorLayerRow(onChange){
  const lr=el("div",{class:"layerrow"});
  MAP_LAYERS.forEach(([id,lab])=>{
    const b=el("button",{"data-l":id,class:state.mapLayer===id?"on":"",onclick:()=>{
      state.mapLayer=id;
      lr.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x.getAttribute("data-l")===id));
      onChange(id);}},lab);
    lr.appendChild(b);});
  return lr;
}
function renderMap(root){
  if(!PARCELS.features.length){root.appendChild(el("div",{class:"stub"},"Parcel data not found (data/parcels.js).")); return;}
  const stage=el("div",{class:"mapstage"});
  const side=el("div",{class:"card pad info",id:"mapinfo"});
  side.appendChild(el("div",{class:"hint"},"Click any parcel for its full public record."));
  const layout=el("div",{class:"maplayout"},stage,side);
  root.appendChild(el("div",{class:"eyebrow"},"Interactive map"));
  root.appendChild(el("h2",{style:"font-size:22px;margin:6px 0 4px"},"The study area, parcel by parcel"));
  root.appendChild(el("p",{class:"muted",style:"margin:0 0 14px;font-size:13px;max-width:86ch"},
    "The three core neighborhoods — University Hill, the University Neighborhood and Westcott (City of Syracuse neighborhood polygons, "+fmtInt(PARCELS.features.filter(f=>f.properties.core).length)+" parcels) — shown vivid over live satellite imagery, with surrounding parcels dimmed for context and neighborhood outlines from the City\u2019s 2017 neighborhood layer (switch them off with the Neighborhood borders button). Switch the base (satellite / both / parcels), recolor by any attribute, and click a parcel for its full public record. City of Syracuse 2025 Q3 roll, "+fmtInt(PARCELS.features.length)+" parcels in all. Assessed value ≠ market value (first reval in ~30 years, 2024–25)."));
  root.appendChild(layout);
  if(window.maplibregl){ try{ initGLMap(stage); }catch(e){ console.error("GL map failed, SVG fallback",e); initSVGFallback(stage); } }
  else { initSVGFallback(stage); }
}

/* ---------- MapLibre map (satellite + parcels) ---------- */
let mapGL=null,_glFallbackTimer=null;
// Deselect the current parcel (GL or SVG map) and reset the record panel.
function deselectParcel(){
  if(!state.sel)return;
  if(state.sel instanceof Element)state.sel.classList.remove("sel");
  state.sel=null;
  if(mapGL){try{mapGL.setFilter("parcels-sel",["==",["get","taxId"],"__none__"]);}catch(e){}}
  renderInfo(null);
}
// Click anywhere outside the map and its record panel, or press Esc, to clear the selection.
document.addEventListener("click",ev=>{
  if(!state.sel||!ev.target.closest)return;
  if(!ev.target.closest(".maplayout")){deselectParcel();return;}          // outside the map + record panel
  const t=ev.target,tag=(t.tagName||"").toLowerCase();
  if(state.sel instanceof Element&&(tag==="svg"||t.classList.contains("mapstage")))deselectParcel();   // empty space on the SVG map
},true);
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&state.sel)deselectParcel();});
function cssVar(n){return (getComputedStyle(document.body).getPropertyValue(n)||"").trim()||"#888";}
function matchExpr(prop,colors,fallback){const e=["match",["get",prop]];for(const k in colors)e.push(k,colors[k]);e.push(fallback);return e;}
function fillExpr(layer){
  if(layer==="ownerClass")return matchExpr("ownerClass",OWNER_COLORS,OWNER_COLORS.private);
  if(layer==="ownerScope")return ["case",["==",["get","ownerClass"],"private"],
    matchExpr("ownerScope",SCOPE_COLORS,SCOPE_COLORS.na),SCOPE_COLORS.na];
  if(layer==="zone")return matchExpr("zone",ZONE_COLORS,"#d9d9d9");
  if(layer==="av")return ["step",["to-number",["get","av"]],"#e5e7eb",1000,"#ffffcc",20000,"#fed976",100000,"#fd8d3c",500000,"#e31a1c",3160000,"#800026"];
  if(layer==="year")return ["case",["has","year"],["step",["to-number",["get","year"]],"#99000d",1900,"#cb181d",1940,"#fb6a4a",1970,"#fcae91",2000,"#fee5d9"],"#e5e7eb"];
  if(layer==="landuse")return matchExpr("luGroup",LU_COLORS,"#d9d9d9");
  if(layer==="vacant")return ["case",["==",["get","vacant"],true],"#d73027","#dfe3e8"];
  return "#cccccc";
}
function fillOpacityExpr(coreOp,ctxOp){return ["case",["==",["get","core"],1],coreOp,ctxOp];}
function initGLMap(stage){
  if(!PARCELS.__lg){for(const f of PARCELS.features)f.properties.luGroup=luGroup(f.properties.landUse);PARCELS.__lg=true;}
  const map=new maplibregl.Map({
    container:stage,
    style:{version:8,sources:{
        sat:{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,maxzoom:19,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'},
        parcels:{type:"geojson",data:PARCELS,promoteId:"taxId"},
        nhoods:{type:"geojson",data:(window.NHOODS||{type:"FeatureCollection",features:[]})}},
      layers:[
        {id:"bg",type:"background",paint:{"background-color":cssVar("--map-bg")}},
        {id:"sat",type:"raster",source:"sat"},
        {id:"parcels-fill",type:"fill",source:"parcels",paint:{"fill-color":fillExpr(state.mapLayer),"fill-opacity":fillOpacityExpr(0.62,0.34)}},
        {id:"parcels-line",type:"line",source:"parcels",paint:{"line-color":"rgba(90,100,110,.45)","line-width":["interpolate",["linear"],["zoom"],13,0.15,16,0.6]}},
        {id:"nb-case-ctx",type:"line",source:"nhoods",filter:["==",["get","core"],0],layout:{"line-join":"round","visibility":state.borders?"visible":"none"},paint:{"line-color":cssVar("--panel"),"line-opacity":.55,"line-width":["interpolate",["linear"],["zoom"],12,2.2,16,3.4]}},
        {id:"nb-line-ctx",type:"line",source:"nhoods",filter:["==",["get","core"],0],layout:{"line-join":"round","visibility":state.borders?"visible":"none"},paint:{"line-color":cssVar("--sel"),"line-opacity":.55,"line-width":["interpolate",["linear"],["zoom"],12,0.8,16,1.4]}},
        {id:"nb-case-core",type:"line",source:"nhoods",filter:["==",["get","core"],1],layout:{"line-join":"round","visibility":state.borders?"visible":"none"},paint:{"line-color":cssVar("--panel"),"line-opacity":.8,"line-width":["interpolate",["linear"],["zoom"],12,3.2,16,5]}},
        {id:"nb-line-core",type:"line",source:"nhoods",filter:["==",["get","core"],1],layout:{"line-join":"round","visibility":state.borders?"visible":"none"},paint:{"line-color":cssVar("--sel"),"line-opacity":.95,"line-width":["interpolate",["linear"],["zoom"],12,1.4,16,2.4]}},
        {id:"parcels-sel",type:"line",source:"parcels",paint:{"line-color":cssVar("--sel"),"line-width":2.6},filter:["==",["get","taxId"],"__none__"]}
      ]},
    center:[-76.1335,43.0425],zoom:13.5,minzoom:11,maxzoom:18,
    cooperativeGestures:true, attributionControl:{compact:true}
  });
  mapGL=map;
  let _glLoaded=false;
  map.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
  map.on("error",e=>{try{console.warn("map:",(e&&e.error&&e.error.message)||"error");}catch(_){}});
  // Robustness: if the satellite/style is blocked or too slow, fall back to the
  // offline SVG parcel map so the user always gets a working map.
  _glFallbackTimer=setTimeout(()=>{
    _glFallbackTimer=null;
    if(!_glLoaded && mapGL===map && !map.isStyleLoaded()){
      console.warn("GL map slow to load — switching to SVG fallback");
      try{map.remove();}catch(_){}
      mapGL=null; stage.innerHTML=""; initSVGFallback(stage);
    }
  },11000);
  map.on("load",()=>{
    _glLoaded=true;
    addGLControls(stage,map);
    addGLAreaLabels(map);
    map.on("click","parcels-fill",e=>{if(!(e.features&&e.features[0]))return;const props=e.features[0].properties;
      if(state.sel&&!(state.sel instanceof Element)&&state.sel.taxId===props.taxId){deselectParcel();return;}
      selectGLParcel(map,props);});
    map.on("mouseenter","parcels-fill",()=>{map.getCanvas().style.cursor="pointer";});
    map.on("mouseleave","parcels-fill",()=>{map.getCanvas().style.cursor="";});
    map.on("click",e=>{const f=map.queryRenderedFeatures(e.point,{layers:["parcels-fill"]});
      if(!f.length)deselectParcel();});
    applyViewMode(map,state.mapMode||"both");
    renderInfo(null);
  });
}
function applyViewMode(map,mode){
  state.mapMode=mode;
  const set=(id,prop,val)=>{try{map.setLayoutProperty(id,prop,val);}catch(e){}};
  if(mode==="sat"){set("sat","visibility","visible");set("parcels-fill","visibility","none");set("parcels-line","visibility","none");set("parcels-sel","visibility","none");}
  else if(mode==="parcels"){set("sat","visibility","none");set("parcels-fill","visibility","visible");set("parcels-line","visibility","visible");set("parcels-sel","visibility","visible");
    map.setPaintProperty("parcels-fill","fill-opacity",fillOpacityExpr(1,0.55));}
  else{set("sat","visibility","visible");set("parcels-fill","visibility","visible");set("parcels-line","visibility","visible");set("parcels-sel","visibility","visible");
    map.setPaintProperty("parcels-fill","fill-opacity",fillOpacityExpr(0.62,0.34));}
  const stage=map.getContainer();stage.querySelectorAll(".viewmodes button").forEach(b=>b.classList.toggle("on",b.getAttribute("data-m")===mode));
}
function addGLControls(stage,map){

    vm.appendChild(el("button",{"data-m":m,title:m==="both"?"Satellite + parcels":m==="sat"?"Satellite only":"Parcels only",class:(state.mapMode||"both")===m?"on":"",onclick:()=>applyViewMode(map,m)},lab)));

function mapSearchBox(map){
  const wrap=el("div",{class:"mapsearch"});
  const inp=el("input",{type:"search",placeholder:"Find a parcel — address or owner…","aria-label":"Find a parcel by address or owner"});
  const res=el("div",{class:"mapsearch-res"});
  wrap.appendChild(inp);wrap.appendChild(res);
  inp.addEventListener("input",()=>{
    const q=inp.value.toLowerCase().trim();res.innerHTML="";
    if(q.length<2){res.classList.remove("on");return;}
    const hits=PARCELS.features.filter(f=>{const p=f.properties;return((p.addr||"")+" "+(p.owner||"")).toLowerCase().includes(q);}).slice(0,10);
    if(!hits.length){res.classList.remove("on");return;}
    res.classList.add("on");
    hits.forEach(f=>{const p=f.properties;
      res.appendChild(el("div",{class:"msrow",onclick:()=>{
        inp.value=p.addr||p.owner||"";res.classList.remove("on");
        if(p.lon!=null&&p.lat!=null)map.flyTo({center:[p.lon,p.lat],zoom:16.5,duration:900});
        selectGLParcel(map,p);}},
        el("div",{class:"msaddr"},p.addr||"(no address)"),
        el("div",{class:"msown"},(p.owner||"")+(p.av?" · "+fmtMoney(p.av):"")))); });
  });

}
function refreshGLOverlays(stage){
  const old=stage.querySelector(".legend");if(old)old.remove();
  stage.appendChild(buildLegend());
  if(!state.sel)renderInfo(null);
}
function addGLAreaLabels(map){
  if(window.NHOODS&&NHOODS.features.length){
    for(const f of NHOODS.features){const p=f.properties;
      const d=el("div",{class:"glarea"+(p.core?"":" ctx"+(state.borders?"":" hide"))},AREA_NAMES[p.name]||p.name);
      new maplibregl.Marker({element:d}).setLngLat(p.center).addTo(map);}
    return;
  }
  const acc={};   // fallback: centre of each core area's parcels
  for(const f of PARCELS.features){const p=f.properties;if(!p.core||!p.nhood||p.lat==null||p.lon==null)continue;
    (acc[p.nhood]=acc[p.nhood]||{x:0,y:0,n:0});acc[p.nhood].x+=p.lon;acc[p.nhood].y+=p.lat;acc[p.nhood].n++;}
  for(const t in acc){const a=acc[t];
    const d=el("div",{class:"glarea"},AREA_NAMES[t]||t);
    new maplibregl.Marker({element:d}).setLngLat([a.x/a.n,a.y/a.n]).addTo(map);}
}
// Neighborhood borders on/off (both maps); remembered between visits.

function bordersButton(){

function selectGLParcel(map,props){

function initSVGFallback(stage){
  if(!PROJ)setupProjection();

  ctrls.appendChild(colorLayerRow(()=>recolorMap()));
  ctrls.appendChild(bordersButton());
  stage.appendChild(ctrls);
  stage.appendChild(el("div",{class:"maphint"},"⌘/Ctrl-scroll or +/− to zoom · drag to pan · zoom in for labels"));

/* full drawMap — builds the SVG once; layer/theme changes recolor in place */
let mapPaths=[],mapLabels=[],mapSvg=null;
function drawMap(){
  const stage=$(".mapstage");if(!stage)return;
  stage.querySelectorAll("svg,.zoomctrl,.legend").forEach(n=>n.remove());
  const svg=svgEl("svg",{viewBox:`0 0 ${MAPW} ${MAPH}`,preserveAspectRatio:"xMidYMid meet"});
  mapSvg=svg;svg.classList.toggle("noborders",!state.borders);
  const g=svgEl("g",{});svg.appendChild(g);mapG=g;
  mapPaths=[];mapLabels=[];mapBorders=[];
  const frag=document.createDocumentFragment();
  for(const f of PARCELS.features){const p=f.properties;
    const path=svgEl("path",{class:"parcel"+(p.core?"":" ctx"),"d":parcelPath(f),fill:colorFor(p,state.mapLayer)});
    path.__p=p;frag.appendChild(path);mapPaths.push(path);}
  g.appendChild(frag);
  addNhoodBorders(g);
  // one delegated click for all 8k parcels (no per-path listeners)
  g.addEventListener("click",ev=>{const t=ev.target;if(t&&t.__p){ev.stopPropagation();selectParcel(t,t.__p);}});
  addAreaLabels(g);addStreetLabels(g);
  svg.addEventListener("click",()=>{if(state.sel){state.sel.classList.remove("sel");state.sel=null;renderInfo(null);}});
  enablePanZoom(svg);
  stage.appendChild(svg);
  stage.appendChild(zoomButtons());
  stage.appendChild(buildLegend());
  applyZoom();
  renderInfo(state.sel?state.sel.__p:null);
}
function recolorMap(){
  for(const path of mapPaths)path.setAttribute("fill",colorFor(path.__p,state.mapLayer));
  const stage=$(".mapstage");if(stage){const ol=stage.querySelector(".legend");if(ol)ol.remove();stage.appendChild(buildLegend());}
  if(!state.sel)renderInfo(null);
}
function applyZoom(){
  const k=zoom.k;
  if(mapG)mapG.setAttribute("transform",`translate(${zoom.x} ${zoom.y}) scale(${k})`);
  if(mapSvg)mapSvg.classList.toggle("zoomed",k>=2.1);
  // counter-scale labels + pins so they stay a constant on-screen size
  for(const L of mapLabels){L.el.setAttribute("font-size",(L.base/k).toFixed(2));L.el.setAttribute("stroke-width",(L.stroke/k).toFixed(2));}
  for(const b of mapBorders)b.el.setAttribute("stroke-width",(b.base/k).toFixed(2));
}
function selectParcel(path,p){if(state.sel===path){deselectParcel();return;}if(state.sel instanceof Element)state.sel.classList.remove("sel");state.sel=path;path.classList.add("sel");renderInfo(p);}

  const grp=(label,rows)=>{const kv=el("dl",{class:"kv"});
    rows.forEach(([k,v])=>{if(v==null||v===""||k==="")return;kv.appendChild(el("dt",{},k));kv.appendChild(el("dd",{},v));});

  grp("Ownership",[["Owner",p.owner],["Owner type",OWNER_LABELS[p.ownerClass]||p.ownerClass],
    p.ownerClass==="private"?["Tax bill mailed to",SCOPE_LABELS[p.ownerScope]||p.ownerScope]:["",null],

    (p.front&&p.depth)?["Lot (ft)",p.front+" × "+p.depth]:["",null]]);
  grp("Administrative",[["Neighborhood",p.nhood],["TNT area",p.tnt],["City ward",p.ward],["DPW quad",p.dpwQuad]]);

function mapStats(){
  const box=el("div",{});
  box.appendChild(el("div",{class:"eyebrow",style:"margin-bottom:8px"},"Core study area · "+layerName()));
  const feats=PARCELS.features.map(f=>f.properties).filter(p=>p.core);
  const total=feats.reduce((s,p)=>s+(p.av||0),0)||1;
  const groups={};
  const keyf=state.mapLayer==="zone"?p=>p.zone
    :state.mapLayer==="ownerScope"?p=>p.ownerClass==="private"?p.ownerScope:"na"
    :state.mapLayer==="vacant"?p=>p.vacant?"vacant":"occupied"
    :state.mapLayer==="landuse"?p=>luGroup(p.landUse)
    :state.mapLayer==="year"?p=>p.year?(p.year<1900?"before 1900":p.year<1940?"1900–40":p.year<1970?"1940–70":p.year<2000?"1970–2000":"2000+"):"unknown"
    :p=>p.ownerClass;
  for(const p of feats){const k=keyf(p)||"—";(groups[k]=groups[k]||{n:0,av:0});groups[k].n++;groups[k].av+=p.av||0;}
  const rows=Object.entries(groups).sort((a,b)=>b[1].av-a[1].av);
  const nameFor=k=>state.mapLayer==="ownerClass"?(OWNER_LABELS[k]||k):state.mapLayer==="ownerScope"?(SCOPE_LABELS[k]||k):state.mapLayer==="landuse"?(LU_LABELS[k]||k):k;
  for(const [k,o] of rows){
    box.appendChild(el("div",{class:"statline"},
      el("span",{style:"flex:1;padding-right:8px"},nameFor(k)),
      el("b",{},(100*o.av/total).toFixed(1)+"%  ·  "+o.n)));
  }
  box.appendChild(el("div",{class:"hint",style:"margin-top:6px"},"share of core assessed value · parcel count · core total "+fmtMoney(total)));
  return box;
}
function layerName(){return{ownerClass:"Ownership",ownerScope:"Tax mailing address",zone:"Zoning",av:"Assessed value",year:"Building age",landuse:"Land use",vacant:"Vacancy"}[state.mapLayer];}

function zoomButtons(){const z=el("div",{class:"zoomctrl"});
  z.appendChild(el("button",{onclick:()=>zoomBy(1.4)},"+"));
  z.appendChild(el("button",{onclick:()=>zoomBy(1/1.4)},"–"));
  z.appendChild(el("button",{title:"reset",style:"font-size:12px",onclick:()=>{zoom={k:1,x:0,y:0};applyZoom();}},"⤾"));
  return z;}
function zoomBy(f){zoom.k=Math.max(1,Math.min(12,zoom.k*f));applyZoom();}
function enablePanZoom(svg){
  let dragging=false,sx=0,sy=0,ox=0,oy=0;
  // Only zoom on ⌘/Ctrl-scroll (Mac trackpad pinch sets ctrlKey, so pinch still
  // zooms); a plain two-finger scroll passes straight through to the page.
  svg.addEventListener("wheel",ev=>{
    if(!(ev.ctrlKey||ev.metaKey))return;
    ev.preventDefault();
    const rect=svg.getBoundingClientRect();const mx=(ev.clientX-rect.left)/rect.width*MAPW,my=(ev.clientY-rect.top)/rect.height*MAPH;
    const f=ev.deltaY<0?1.12:1/1.12;const nk=Math.max(1,Math.min(12,zoom.k*f));
    zoom.x=mx-(mx-zoom.x)*(nk/zoom.k);zoom.y=my-(my-zoom.y)*(nk/zoom.k);zoom.k=nk;
    if(zoom.k===1){zoom.x=0;zoom.y=0;}applyZoom();},{passive:false});
  svg.addEventListener("pointerdown",ev=>{dragging=true;svg.classList.add("drag");sx=ev.clientX;sy=ev.clientY;ox=zoom.x;oy=zoom.y;svg.setPointerCapture(ev.pointerId);});
  svg.addEventListener("pointermove",ev=>{if(!dragging)return;const rect=svg.getBoundingClientRect();
    zoom.x=ox+(ev.clientX-sx)/rect.width*MAPW;zoom.y=oy+(ev.clientY-sy)/rect.height*MAPH;applyZoom();});
  svg.addEventListener("pointerup",ev=>{dragging=false;svg.classList.remove("drag");});
  svg.addEventListener("pointercancel",()=>{dragging=false;svg.classList.remove("drag");});
}
// Core areas = City of Syracuse neighborhood polygons (parcel NHOOD field), matching the study boundary.
const AREA_NAMES={"University Hill":"University Hill","University Neighborhood":"University Neighborhood","Westcott":"Westcott"};
function nhoodPath(geom){
  const rings=geom.type==="Polygon"?geom.coordinates:geom.coordinates.flat();let d="";
  for(const r of rings){r.forEach((p,i)=>{d+=(i?"L":"M")+projX(p[0]).toFixed(1)+" "+projY(p[1]).toFixed(1);});d+="Z";}
  return d;
}
function addNhoodBorders(g){
  if(!(window.NHOODS&&NHOODS.features.length))return;
  for(const f of NHOODS.features){const p=f.properties;
    const path=svgEl("path",{class:"nb "+(p.core?"core":"ctx"),"d":nhoodPath(f.geometry)});
    g.appendChild(path);mapBorders.push({el:path,base:p.core?1.7:0.9});}
}
function addAreaLabels(g){
  if(window.NHOODS&&NHOODS.features.length){
    for(const f of NHOODS.features){const p=f.properties;const x=projX(p.center[0]),y=projY(p.center[1]);const base=p.core?13:9.5;
      const t=svgEl("text",{class:"arealabel"+(p.core?"":" ctx"),x:x,y:y,"font-size":base,"text-anchor":"middle"});
      t.textContent=AREA_NAMES[p.name]||p.name;g.appendChild(t);mapLabels.push({el:t,base:base,stroke:p.core?3.5:2.6});}
    return;
  }
  const acc={};   // fallback: centre of each core area's parcels
  for(const f of PARCELS.features){const p=f.properties;if(!p.core||!p.nhood||p.lat==null||p.lon==null)continue;
    (acc[p.nhood]=acc[p.nhood]||{x:0,y:0,n:0});acc[p.nhood].x+=p.lon;acc[p.nhood].y+=p.lat;acc[p.nhood].n++;}
  for(const t in acc){const a=acc[t];const x=projX(a.x/a.n),y=projY(a.y/a.n);
    const el=svgEl("text",{class:"arealabel",x:x,y:y,"font-size":13,"text-anchor":"middle"});
    el.textContent=AREA_NAMES[t]||t;g.appendChild(el);mapLabels.push({el,base:13,stroke:3.5});}
}
function addStreetLabels(g){
  const acc={};
  for(const f of PARCELS.features){const p=f.properties;if(!p.core||!p.street||p.lat==null)continue;
    const s=p.street.replace(/\s+(ave|st|street|pl|place|blvd|dr)\b.*/i,"").trim();
    (acc[s]=acc[s]||{x:0,y:0,n:0});acc[s].x+=p.lon;acc[s].y+=p.lat;acc[s].n++;}
  const big=Object.entries(acc).filter(([s,a])=>a.n>=14).sort((a,b)=>b[1].n-a[1].n).slice(0,16);

function finishTable(root,table,csvName){

function enhanceTable(table){
  const ths=[...table.querySelectorAll("thead th")];
  const tbody=table.querySelector("tbody");if(!tbody)return;
  let sortCol=-1,asc=true;
  const num=t=>{const m=String(t).replace(/[^0-9.\-]/g,"");return m===""||m==="-"?null:parseFloat(m);};
  const key=(tr,ci)=>{const c=tr.children[ci];if(!c)return"";const d=c.getAttribute("data-sort");return d!=null?d:c.textContent.trim();};
  ths.forEach((th,ci)=>{
    if(!th.textContent.trim())return;
    th.classList.add("sortable");th.tabIndex=0;th.setAttribute("role","button");th.title="Sort by "+th.textContent.trim();
    const doSort=()=>{
      asc=(sortCol===ci)?!asc:true;sortCol=ci;
      const rows=[...tbody.querySelectorAll("tr")];
      rows.sort((a,b)=>{const x=key(a,ci),y=key(b,ci),nx=num(x),ny=num(y);
        let r=(nx!=null&&ny!=null)?nx-ny:String(x).localeCompare(String(y));return asc?r:-r;});
      rows.forEach(r=>tbody.appendChild(r));
      ths.forEach(h=>h.classList.remove("sort-asc","sort-desc"));th.classList.add(asc?"sort-asc":"sort-desc");
    };
    th.onclick=doSort;th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();doSort();}};
  });
}
function tableCSV(table){
  return [...table.querySelectorAll("tr")].map(tr=>[...tr.children].map(c=>{
    let t=(c.getAttribute("data-sort")!=null&&/^[\d.\-]+$/.test(c.getAttribute("data-sort"))?c.getAttribute("data-sort"):c.textContent).replace(/\s+/g," ").trim();
    return /[",\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;}).join(",")).join("\n");
}
function downloadCSV(table,name){
  const blob=new Blob([tableCSV(table)],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

  return svg;}
function barSVG(pts,unit){
  const cats=pts.map(p=>({lab:(p.label!=null?p.label:p.year),v:p.value})).filter(c=>typeof c.v==="number");
  const W=380,rowH=24,T=6,R=52;
  const L=Math.min(160,Math.max(66,Math.max(...cats.map(c=>String(c.lab).length))*5.6));
  const H=T+cats.length*rowH+6,vmax=Math.max(...cats.map(c=>c.v),0)||1;
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H});
  cats.forEach((c,i)=>{const y=T+i*rowH,bw=Math.max(1,(c.v/vmax)*(W-L-R));
    const lab=svgEl("text",{class:"axlab",x:L-7,y:y+rowH/2+3,"text-anchor":"end"});lab.textContent=trunc(c.lab,26);svg.appendChild(lab);
    const rect=svgEl("rect",{class:"cbar",x:L,y:y+4,width:bw,height:rowH-9,rx:2});
    tipMark(rect,null,c.lab+": "+fmtNum(c.v)+(unit?" "+unit:""));svg.appendChild(rect);
    const vt=svgEl("text",{class:"axlab",x:L+bw+5,y:y+rowH/2+3});vt.textContent=fmtNum(c.v);svg.appendChild(vt);});
  return svg;}
function chartSecTag(sec){return el("span",{class:"chart-sec",title:"Go to §"+sec,onclick:e=>{e.stopPropagation();go("s"+sec);}},"§"+sec);}
function buildChart(s,showSec){
  const fig=el("figure",{class:"chart"});
  if(showSec&&s.section)fig.appendChild(chartSecTag(s.section));
  const pts=(s.points||[]).filter(p=>typeof p.value==="number");
  if(!pts.length){fig.appendChild(el("div",{class:"muted",style:"font-size:12px;padding:20px"},"no plottable points"));}
  else fig.appendChild((s.kind==="bar"||s.kind==="comparison")?barSVG(pts,s.unit):lineChart([{label:s.label,points:pts}],{unit:s.unit}));
  fig.appendChild(el("figcaption",{},s.label+(s.unit?" ("+s.unit+")":"")));
  fig.appendChild(el("div",{class:"csrc"},(s.source||"")+(s.note?" · "+s.note:"")));
  return fig;}
function shortLabel(l){return String(l).replace(/^City of Syracuse:?\s*/i,"").replace(/\s*\(non-Hispanic\)/i," NH")
  .replace(/\s*share$/i,"").replace(/Median (HH|household) income (slope )?(for )?/i,"")
  .replace(/University Hill.*core population.*/i,"University Hill core").replace(/.*population by decade/i,"City of Syracuse");}
function comboFigure(c){
  const fig=el("figure",{class:"chart wide"});
  fig.appendChild(lineChart(c.lines,{unit:c.unit,zeroBase:c.zeroBase}));
  fig.appendChild(el("figcaption",{},c.title+(c.unit?" ("+c.unit+")":"")));
  const lg=el("div",{class:"clegend"});
  c.lines.forEach((ln,i)=>lg.appendChild(el("span",{},el("i",{style:"background:"+(ln.color||SERIES_COLORS[i%SERIES_COLORS.length])}),ln.label)));
  fig.appendChild(lg);
  if(c.source)fig.appendChild(el("div",{class:"csrc"},c.source));
  return fig;}
function comparisonsFor(n){
  const out=[],S=DATA.series;
  const combo=(title,arr,unit,zeroBase)=>{arr=arr.filter(s=>(s.points||[]).filter(p=>typeof p.value==="number").length>=2);
    if(arr.length<2)return;
    const lines=arr.map((s,i)=>({label:shortLabel(s.label),color:SERIES_COLORS[i%SERIES_COLORS.length],points:s.points.filter(p=>typeof p.value==="number")}));
    const src=[...new Set(arr.map(s=>s.source).filter(Boolean))].slice(0,2).join("; ");
    out.push({title,lines,unit,zeroBase,source:src});};
  if(n===3){
    combo("City racial & ethnic composition — share",S.filter(s=>/(White|Black|Hispanic)/i.test(s.label)&&/share/i.test(s.label)),"% of population",true);
    // Same composition in absolute people: share × City population.
    const pop=S.find(s=>/population by decade/i.test(s.label));
    const shW=S.find(s=>/White \(non-Hispanic\) share/i.test(s.label)),
          shB=S.find(s=>/Black \(non-Hispanic\) share/i.test(s.label)),
          shH=S.find(s=>/Hispanic share/i.test(s.label));
    if(pop&&shW&&shB&&shH){
      const popAt=y=>{const p=pop.points.find(pt=>pt.year===y);return p?p.value:null;};
      const yrs=[2000,2010,2020,2024];
      const mk=(lab,ser,ci)=>({label:lab,color:SERIES_COLORS[ci],points:yrs.map(y=>{const s=ser.points.find(pt=>pt.year===y),pv=popAt(y);return(s&&pv!=null)?{year:y,value:Math.round(s.value/100*pv)}:null;}).filter(Boolean)});
      out.push({title:"City racial & ethnic composition — people (estimated)",unit:"people",zeroBase:true,
        lines:[mk("White (NH)",shW,0),mk("Black (NH)",shB,1),mk("Hispanic",shH,2)],
        source:"Estimated as decennial / ACS share × City population. Shares are rounded, so counts are approximate."});
    }
    combo("SU enrollment — undergraduate vs. graduate (NYSED)",S.filter(s=>/NYSED/i.test(s.label)&&/(undergrad|graduate)/i.test(s.label)),"students",true);
    combo("City population vs. University Hill core",S.filter(s=>/population by decade|core population/i.test(s.label)),"residents",true);
    combo("Median household income by tract",S.filter(s=>/income/i.test(s.label)&&/tract/i.test(s.label)),"$");
  }
  if(n===7)combo("For-sale listings, Syracuse metro",S.filter(s=>/active for-sale listings/i.test(s.label)),"listings",true);
  return out;}

/* ---------- timeline (events only) ---------- */
const MONTHS=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SEC_TITLE={2:"Planning & Zoning",3:"District Context",4:"Governance",7:"Real Estate",10:"Current Issues"};
function dateChip(e){return e.month?MONTHS[e.month]+" "+e.year:String(e.year);}
function renderTimeline(root){
  vhead(root,"Dated events","Timeline",
    DATA.chronology.length+" dated events across the five sections. Filter by section; every write-up is shown in place. Charts and trends are on the Charts tab.");
  let secF=null;
  const chips=el("div",{class:"fchips"});
  const tl=el("div",{});
  [["All",null],["§2",2],["§3",3],["§4",4],["§7",7],["§10",10]].forEach(([lab,n],i)=>{
    const b=el("button",{class:"fchip"+(i===0?" on":"")},lab);
    b.onclick=()=>{secF=n;[...chips.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");drawTL();};
    chips.appendChild(b);});
  root.appendChild(chips);root.appendChild(tl);
  function drawTL(){tl.innerHTML="";
    const evs=DATA.chronology.filter(e=>!secF||e.section===secF).slice()
      .sort((a,b)=>(a.year-b.year)||((a.month||0)-(b.month||0)));
    if(!evs.length){tl.appendChild(el("div",{class:"stub"},"No events for this section."));return;}
    const byYear={};evs.forEach(e=>{(byYear[e.year]=byYear[e.year]||[]).push(e);});
    const wrap=el("div",{class:"tl2"});
    Object.keys(byYear).sort((a,b)=>a-b).forEach(y=>{
      const grp=el("div",{class:"tlgroup"},el("div",{class:"yr"},y));
      byYear[y].forEach(e=>grp.appendChild(el("div",{class:"tlcard2"},
        e.month?el("div",{class:"dchip"},dateChip(e)):null,
        el("div",{class:"tt2"},el("span",{class:"ttl2"},e.title),
          el("span",{class:"sx2",title:"Open §"+e.section,onclick:()=>go("s"+e.section)},"§"+e.section),chip(e.tag)),
        e.writeup?el("div",{class:"wu2"},e.writeup):null)));
      wrap.appendChild(grp);});
    tl.appendChild(wrap);}
  drawTL();
}

/* ---------- charts & trends (own page) ---------- */
function renderCharts(root){
  vhead(root,"Data series","Charts & trends",
    "Every plottable series from the research. Comparison overlays come first — related series on one set of axes — then the individual series, grouped by section. Hover any point for its date and value.");
  const comps=[...comparisonsFor(3),...comparisonsFor(7),...comparisonsFor(4),...comparisonsFor(10)];
  if(comps.length){
    root.appendChild(el("h3",{class:"h"},"Comparisons"));
    root.appendChild(el("div",{class:"sublabel"},"related series overlaid on one chart"));
    const cg=el("div",{class:"chartgrid"});comps.forEach(c=>cg.appendChild(comboFigure(c)));root.appendChild(cg);
  }
  [2,3,4,7,10].forEach(n=>{
    const ser=DATA.series.filter(s=>s.section===n);
    if(!ser.length)return;
    root.appendChild(el("h3",{class:"h"},"§"+n+" · "+SEC_TITLE[n]));
    const g=el("div",{class:"chartgrid"});ser.forEach(s=>g.appendChild(buildChart(s,false)));root.appendChild(g);
  });
}

/* ---------- registers (combined: sources / corrections / open) ---------- */
function renderRegisters(root){
  const subs=[["sources","Sources",renderSources],["corrections","Corrections",renderCorrections],["open","Open items",renderOpen]];
  const cur=state.regSub||(["sources","corrections","open"].includes(state.view)?state.view:"sources");
  state.regSub=cur;
  const bar=el("div",{class:"subtabs"});
  const body=el("div",{});
  subs.forEach(([id,lab,fn])=>{
    const b=el("button",{class:"subtab"+(id===cur?" on":"")},lab);
    b.onclick=()=>{state.regSub=id;[...bar.children].forEach(x=>x.classList.toggle("on",x===b));body.innerHTML="";fn(body);};
    bar.appendChild(b);});
  root.appendChild(bar);root.appendChild(body);
  (subs.find(s=>s[0]===cur)[2])(body);
}

/* ---------- boot ---------- */
buildTabs();
(function(){const h=location.hash.replace(/^#/,"").split("=")[0];if(h)state.view=h;else state.view="overview";})();
render();
</script>
